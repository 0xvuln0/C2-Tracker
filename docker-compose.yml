version: "3.8"

services:
  c2tracker:
    build: .
    container_name: c2tracker
    volumes:
      - ./test_samples:/samples:ro
      - ./.env:/app/.env:ro
      - ./rules:/app/rules:ro
    environment:
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - CENSYS_API_ID=${CENSYS_API_ID:-}
      - CENSYS_API_SECRET=${CENSYS_API_SECRET:-}
    command: ["--help"]

  # Scan network connections (needs host network + root)
  scan-net:
    build: .
    container_name: c2tracker-scan
    network_mode: host
    pid: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - CENSYS_API_ID=${CENSYS_API_ID:-}
      - CENSYS_API_SECRET=${CENSYS_API_SECRET:-}
    command: ["scan", "--no-api"]
    privileged: true
    profiles:
      - scan

  # Scan files
  scan-file:
    build: .
    container_name: c2tracker-filescan
    volumes:
      - ./test_samples:/samples:ro
      - ./.env:/app/.env:ro
      - ./rules:/app/rules:ro
    environment:
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      - CENSYS_API_ID=${CENSYS_API_ID:-}
      - CENSYS_API_SECRET=${CENSYS_API_SECRET:-}
    command: ["scan-file", "-v", "/samples/"]
    profiles:
      - file

  # Update IOC database
  update:
    build: .
    container_name: c2tracker-update
    volumes:
      - ./.env:/app/.env:ro
    environment:
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
    command: ["update", "--force"]
    profiles:
      - update
