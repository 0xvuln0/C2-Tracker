[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c2tracker"
version = "0.2.1"
description = "C2 server tracker - monitors network connections and identifies Command & Control infrastructure via Shodan and Censys"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "psutil>=5.9.0",
    "shodan>=1.28.0",
    "censys>=2.2.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
yara = ["yara-python>=4.3.0"]
config = ["pyyaml>=6.0"]
all = ["yara-python>=4.3.0", "pyyaml>=6.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "bandit>=1.7.0",
    "pip-audit>=2.6.0",
]

[project.scripts]
c2tracker = "cli:main"

[tool.setuptools]
py-modules = [
    "cli", "analyzer", "config", "censys_lookup", "export",
    "file_scanner", "hunter", "malware_db", "mitre_attack",
    "models", "network", "shodan_lookup", "yara_scanner",
    "db_updater", "api_cache",
]

[tool.setuptools.package-data]
"*" = ["*.yar", "*.yaml"]

[tool.setuptools.packages.find]
include = ["c2tracker*"]
exclude = ["rules*", "test_samples*", "tests*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "E402", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
